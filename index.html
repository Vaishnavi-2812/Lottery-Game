<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lottery Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎲 Lottery Game</h1>

    <p>Guess a number between <strong>1 to 10</strong></p>

    <input type="number" id="userNum" min="1" max="10" placeholder="Enter number">

    <button onclick="playGame()">Try Your Luck</button>

    <h2 id="result"></h2>
</div>

<script src="script.js"></script>
</body>
</html>
